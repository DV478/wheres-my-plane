name: Keep-alive

# GitHub disables scheduled workflows after 60 days of repo inactivity.
# This nudge commits a timestamp file every 50 days to reset the counter.

on:
  schedule:
    - cron: '0 6 1,15 * *'   # 1st and 15th of every month at 06:00 UTC
  workflow_dispatch:

jobs:
  nudge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Touch keep-alive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keep-alive
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/.keep-alive
          git diff --cached --quiet || git commit -m "chore: keep-alive nudge"
          git push
