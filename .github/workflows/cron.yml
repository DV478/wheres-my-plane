name: cron-tick

# CURRENT MODE: on-demand. The schedule is disabled. Ticks are driven by the
# Start/Stop panel on /app — a browser setInterval that POSTs /api/scheduler/kick
# every 2 minutes while the tab is active and visible.
#
# Flip back to always-on (2 lines):
#   on:
#     schedule:
#       - cron: '* * * * *'   # <- uncomment this and the line above
#     workflow_dispatch:
#
# The Pages Project doesn't support [triggers] crons in wrangler.toml
# (Workers-only), so this workflow remains the cron source for always-on mode.
#
# WMP_CRON_SECRET must still be set as an Actions secret — workflow_dispatch
# manual fires still work and the secret-gated endpoint is unchanged.

on:
  # schedule:
  #   - cron: '* * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poke /api/cron/tick
        env:
          WMP_CRON_SECRET: ${{ secrets.WMP_CRON_SECRET }}
        run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" \
            -X POST \
            -H "x-wmp-cron-secret: ${WMP_CRON_SECRET}" \
            -H "content-length: 0" \
            https://wheres-my-plane.pages.dev/api/cron/tick)
          echo "status: ${code}"
          cat /tmp/body || true
          test "${code}" = "200"
